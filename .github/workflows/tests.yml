name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements.txt flake8
      # Pyflakes' checks only (unused or undefined names), so a stale import
      # or a misspelt name fails here rather than when the line runs.
      - run: python -m flake8 --select=F scripts tests
      # PYTHONUTF8 is deliberately not set: the scripts' handling of a
      # Windows console's legacy code page is part of what this checks.
      - run: python -m unittest discover -s tests -v
      # The same tests, a file per process: it has to pass on Linux too, and
      # its wall time is in this log.
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python tests/run_parallel.py
